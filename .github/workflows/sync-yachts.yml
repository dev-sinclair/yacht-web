name: Sync yacht snapshot

# Refreshes src/data/yachts/ from Ankor every 6 hours and commits any
# changes back to main. The catalogue reads from this snapshot, so a
# successful commit triggers a Vercel deploy with fresh data.
#
# If Ankor is unavailable, the script exits non-zero, this workflow
# fails, GitHub emails the owner, and the previous snapshot keeps serving.
# The site never breaks because of a sync failure.

on:
  schedule:
    # Every 6h at :00 UTC (00:00, 06:00, 12:00, 18:00). GitHub's free
    # cron is best-effort — runs may be delayed 5-15 min during platform
    # load. Doesn't matter at this cadence.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Adds a "Run workflow" button in the Actions UI for forced refreshes
    # (e.g., a yacht just got added and we don't want to wait for the
    # next slot).

# Never run two syncs at once. If a manual trigger fires while the
# scheduled run is in flight, queue it.
concurrency:
  group: sync-yachts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to push the snapshot commit
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the `packageManager` field in package.json.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync yacht snapshot
        env:
          ANKOR_BASE_URL:    ${{ secrets.ANKOR_BASE_URL }}
          ANKOR_COMPANY_URI: ${{ secrets.ANKOR_COMPANY_URI }}
          ANKOR_KEY_ID:      ${{ secrets.ANKOR_KEY_ID }}
          ANKOR_PRIVATE_KEY: ${{ secrets.ANKOR_PRIVATE_KEY }}
          ANKOR_DEFAULT_CURRENCY: ${{ vars.ANKOR_DEFAULT_CURRENCY || 'EUR' }}
          ANKOR_MIN_LENGTH_M:    ${{ vars.ANKOR_MIN_LENGTH_M || '15' }}
          ANKOR_MIN_WEEK_PRICE_CENTS: ${{ vars.ANKOR_MIN_WEEK_PRICE_CENTS || '1500000' }}
        run: pnpm exec tsx scripts/sync-yachts.ts

      - name: Commit changes if any
        run: |
          git config user.name  "yacht-sync[bot]"
          git config user.email "yacht-sync@users.noreply.github.com"
          git add src/data/yachts
          if git diff --cached --quiet; then
            echo "[sync] no data changed — skipping commit"
            exit 0
          fi
          # Surface what changed in the commit body for git log readability.
          CHANGED=$(git diff --cached --name-only | wc -l)
          git commit -m "data: sync yacht snapshot ($CHANGED files changed)"
          git push
          echo "[sync] pushed snapshot update"
